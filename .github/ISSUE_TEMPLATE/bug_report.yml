name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Load the challenge...\n2. Run an experiment..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / commit
    validations:
      required: false